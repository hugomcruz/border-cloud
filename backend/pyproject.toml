[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hetzner-vm-api"
version = "0.1.0"
description = "FastAPI backend for Hetzner VM Management UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "hcloud>=2.0.0",
    "sse-starlette>=2.1.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
select = ["ALL"]
ignore = [
    "D",        # docstrings not required
    "ANN",      # type annotations managed by mypy
    "S101",     # assert allowed in tests
    "COM812",   # trailing comma conflict with formatter
    "ISC001",   # implicit string concat conflict with formatter
]
line-length = 100
target-version = "py312"

[tool.ruff.per-file-ignores]
"tests/*" = ["S", "PLR2004", "ARG", "FBT"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-fail-under=80 --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.scripts]
lint = "ruff check app/ tests/"
typecheck = "mypy app/"
test = "pytest"
test-cov = "pytest --cov=app --cov-report=html"
