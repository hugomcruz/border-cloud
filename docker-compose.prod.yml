# Production compose — no bundled database.
# DATABASE_URL must point to an external/managed PostgreSQL instance.
# Usage: docker compose -f docker-compose.prod.yml up --build -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      API_URL: http://backend:8000
    ports:
      - "3000:3000"
    networks:
      - app-net

networks:
  app-net:
