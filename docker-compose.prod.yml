# Production compose — pulls pre-built images from Harbor, no local build.
# Usage: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d

services:
  backend:
    image: harbor.bnov.net/border/cloud-ui-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - app-net

  frontend:
    image: harbor.bnov.net/border/cloud-ui-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      API_URL: http://backend:8000
    ports:
      - "3000:3000"
    networks:
      - app-net

networks:
  app-net:
