services:
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: vmapp_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db_test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://test:test@db_test:5432/vmapp_test
      SECRET_KEY: test-jwt-secret-for-integration-tests-only-not-prod
      HETZNER_API_TOKEN: test-token
      CLOUDFLARE_API_TOKEN: test-token
      CLOUDFLARE_ZONE_ID: test-zone
      IP_REFLECTION_URL: https://api.ipify.org?format=json
      LOGIN_RATE_LIMIT: "1000/minute"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
