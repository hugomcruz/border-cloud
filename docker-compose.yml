services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vmapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-vmapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vmapp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use the Docker service hostname instead of localhost
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vmapp}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-vmapp}
    ports:
      - "8000:8000"
    networks:
      - backend-net
      - frontend-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    networks:
      - frontend-net

networks:
  backend-net:
  frontend-net:

volumes:
  pgdata:
